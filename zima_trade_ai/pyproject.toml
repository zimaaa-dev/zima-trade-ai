[project]
name = "zima-trade-ai"
version = "1.0.0"
description = "Autonomous cryptocurrency trading complex with L2-50 orderbook simulation, procedural risk firewall and dual shadow/live engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZimaTrade Lab", email = "zimaaalab@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "telethon>=1.34.0",
    "aiohttp>=3.9.5",
    "websockets>=12.0",
    "duckdb>=0.10.2",
    "pyarrow>=15.0.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "nicegui>=1.4.25",
    "onnxruntime>=1.17.3",
    "lightgbm>=4.3.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "psutil>=5.9.8",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.7",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
]
gpu = [
    "torch>=2.2.2",
    "torchvision>=0.17.2",
    "tensorboard>=2.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
