name: ZIMA-TRADE-AI Pre-Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-quant-core:
    name: "Run 31 Quant & Risk Firewall Tests + Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Check (lint)
        run: npm run lint

      - name: Execute 5-Level Pre-Production Test Suite (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
